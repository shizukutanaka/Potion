version: '3.8'

# Minimal working stack: the app plus the observability configs that
# actually exist in ./monitoring. The previous file also defined
# postgres/redis (nothing in the app connects to them) and
# grafana/loki/tempo (all of whose mounted config files were missing),
# so half the services could not start.

services:
  potion-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      # Container environment: appsettings.Container.json binds Kestrel
      # http://+:80 and uses console+file sinks. The Development config
      # binds localhost:5000, and the Production config is Windows-only
      # (EventLog sink, C:\ProgramData paths) — neither works in Linux.
      - ASPNETCORE_ENVIRONMENT=Container
    volumes:
      - ./src/Potion.Service/appsettings.Container.json:/app/appsettings.Container.json
      - ./logs:/app/logs
    networks:
      - potion-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml
    networks:
      - potion-network
    restart: unless-stopped
    depends_on:
      - potion-service
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - potion-network
    restart: unless-stopped

volumes: {}

networks:
  potion-network:
    driver: bridge
