version: '3.8'

services:
  potion-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
      - "5443:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ASPNETCORE_HTTPS_PORT=443
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    volumes:
      - ./src/Potion.Service/appsettings.Development.json:/app/appsettings.Development.json
      - ./src/Potion.Service/Resources:/app/Resources
      - ./logs:/app/logs
      - ~/.aspnet/https:/https:ro
    depends_on:
      - postgres
      - redis
    networks:
      - potion-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=Potion
      - POSTGRES_USER=potion_user
      - POSTGRES_PASSWORD=potion_password_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - potion-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - potion-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass potion_redis_2024

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - potion-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - potion-network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
    networks:
      - potion-network
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    ports:
      - "14268:14268"
      - "3200:3200"
    volumes:
      - tempo_data:/tmp/tempo
      - ./monitoring/tempo-config.yml:/etc/tempo/tempo.yaml
    networks:
      - potion-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - potion-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  loki_data:
  tempo_data:

networks:
  potion-network:
    driver: bridge
