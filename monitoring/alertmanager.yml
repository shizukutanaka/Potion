# Alertmanager configuration: delivers every alert to the Potion service's
# webhook endpoint (POST /api/health/alerts/webhook), which logs firing and
# resolved alerts. External receivers (SMTP, Slack) need real credentials —
# add them here when available instead of pointing at placeholder hosts.

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'potion-team'

receivers:
  - name: 'potion-team'
    webhook_configs:
      - url: 'http://potion-service:80/api/health/alerts/webhook'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
