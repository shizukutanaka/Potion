global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'potion-service'
    static_configs:
      - targets: ['potion-service:80']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
