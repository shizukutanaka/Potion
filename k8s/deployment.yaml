apiVersion: v1
kind: ConfigMap
metadata:
  name: potion-service-config
  namespace: potion-system
  labels:
    app: potion-service
data:
  # Application settings — only keys the app actually binds.
  # Kestrel:Endpoints in appsettings.json beats ASPNETCORE_URLS, so the
  # endpoint itself must be overridden for the pod to listen on :80.
  ASPNETCORE_ENVIRONMENT: "Production"
  Kestrel__Endpoints__Http__Url: "http://+:80"

  # Feature flags (default off — enable deliberately per environment)
  FeatureFlags__RepairExecutionEnabled: "false"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: potion-service
  namespace: potion-system
  labels:
    app: potion-service
    version: v2.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: potion-service
  template:
    metadata:
      labels:
        app: potion-service
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: potion-service
        image: potion-service:2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        envFrom:
        - configMapRef:
            name: potion-service-config
        env:
        # ServicePaths falls back to $HOME/.local/share; with a read-only
        # rootfs this must point at a writable mount.
        - name: HOME
          value: /app/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: data
          mountPath: /app/data
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 101
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: logs
        emptyDir: {}
      - name: data
        emptyDir: {}
      securityContext:
        fsGroup: 101
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - potion-service
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: potion-service
  namespace: potion-system
  labels:
    app: potion-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: potion-service
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: potion-service-ingress
  namespace: potion-system
  labels:
    app: potion-service
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - potion-service.example.com
    secretName: potion-service-tls
  rules:
  - host: potion-service.example.com
    http:
      paths:
      # Backend serves these paths natively — no rewrite needed.
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: potion-service
            port:
              number: 80
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: potion-service
            port:
              number: 80
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: potion-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: potion-service
            port:
              number: 80
---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: potion-service-monitor
  namespace: potion-system
  labels:
    app: potion-service
spec:
  selector:
    matchLabels:
      app: potion-service
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: potion-service-pdb
  namespace: potion-system
  labels:
    app: potion-service
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: potion-service
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: potion-service-quota
  namespace: potion-system
spec:
  hard:
    requests.cpu: "2"
    requests.memory: "2Gi"
    limits.cpu: "4"
    limits.memory: "4Gi"
    persistentvolumeclaims: "5"
    services.loadbalancers: "2"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: potion-service-netpol
  namespace: potion-system
  labels:
    app: potion-service
spec:
  podSelector:
    matchLabels:
      app: potion-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
  - from: []
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: potion-database
    ports:
    - protocol: TCP
      port: 5432
