name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 毎日午前2時にセキュリティスキャンを実行
    - cron: '0 2 * * *'

env:
  DOTNET_VERSION: '8.0.x'
  BUILD_CONFIGURATION: 'Release'
  SOLUTION_PATH: 'Potion.sln'

permissions:
  contents: read
  packages: write
  security-events: write
  issues: write
  pull-requests: write

jobs:
  # 初期検証
  validate:
    name: Validate
    runs-on: windows-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Check if deployment should proceed
      id: check
      run: |
        if ($env:GITHUB_REF -eq 'refs/heads/main') {
          echo "should-deploy=true" >> $env:GITHUB_OUTPUT
        } else {
          echo "should-deploy=false" >> $env:GITHUB_OUTPUT
        }

  # セキュリティスキャン
  security-scan:
    name: Security Scan
    runs-on: windows-latest
    needs: validate
    outputs:
      vulnerabilities-found: ${{ steps.audit-eval.outputs.vulnerabilities-found }}
      vulnerability-details: ${{ steps.audit-eval.outputs.vulnerability-details }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Run NuGet Audit
      run: dotnet list package --vulnerable --format json | Out-File -FilePath nuget-audit.json
      continue-on-error: true

    # NuGet Audit の出力は SARIF 形式ではないため、upload-sarif には渡さない
    # （形式不一致でステップが失敗し、security-scan 全体が失敗扱いになっていた）。
    # 結果はアーティファクトとして保存する。
    - name: Upload NuGet Audit results
      uses: actions/upload-artifact@v4
      with:
        name: nuget-audit-results
        path: nuget-audit.json
        if-no-files-found: warn
      if: always()

    # 監査結果を実際に解析し、「脆弱性が検出されたか」をジョブ出力にする。
    # notification ジョブはこの出力が true のときだけ Issue を作成する。
    - name: Evaluate NuGet Audit results
      id: audit-eval
      if: always()
      run: |
        $found = 'false'
        $details = ''
        if (Test-Path 'nuget-audit.json') {
          try {
            $audit = Get-Content 'nuget-audit.json' -Raw | ConvertFrom-Json
            $vulns = @()
            foreach ($project in $audit.projects) {
              foreach ($framework in $project.frameworks) {
                $packages = @()
                if ($framework.topLevelPackages) { $packages += $framework.topLevelPackages }
                if ($framework.transitivePackages) { $packages += $framework.transitivePackages }
                foreach ($pkg in $packages) {
                  if ($pkg.vulnerabilities) {
                    foreach ($v in $pkg.vulnerabilities) {
                      $vulns += "- $($pkg.id) $($pkg.resolvedVersion): severity $($v.severity) ($($v.advisoryurl))"
                    }
                  }
                }
              }
            }
            if ($vulns.Count -gt 0) {
              $found = 'true'
              $details = ($vulns | Select-Object -First 20) -join "`n"
              Write-Host "NuGet Audit: $($vulns.Count) vulnerable package occurrence(s) detected."
              $vulns | ForEach-Object { Write-Host $_ }
              "## NuGet Audit: $($vulns.Count) vulnerable package occurrence(s) detected" >> $env:GITHUB_STEP_SUMMARY
              $vulns | ForEach-Object { $_ >> $env:GITHUB_STEP_SUMMARY }
            } else {
              Write-Host "NuGet Audit: no vulnerable packages detected."
              "## NuGet Audit: no vulnerable packages detected" >> $env:GITHUB_STEP_SUMMARY
            }
          } catch {
            Write-Warning "Could not parse nuget-audit.json: $_"
          }
        } else {
          Write-Warning "nuget-audit.json not found; audit results unavailable."
        }
        echo "vulnerabilities-found=$found" >> $env:GITHUB_OUTPUT
        $delimiter = [guid]::NewGuid().ToString()
        echo "vulnerability-details<<$delimiter" >> $env:GITHUB_OUTPUT
        echo "$details" >> $env:GITHUB_OUTPUT
        echo "$delimiter" >> $env:GITHUB_OUTPUT

    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  # コード品質チェック
  code-quality:
    name: Code Quality
    runs-on: windows-latest
    needs: validate

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install SonarCloud scanner
      run: |
        dotnet tool install --global dotnet-sonarscanner
        dotnet tool install --global dotnet-coverage

    - name: Run SonarCloud analysis
      run: |
        dotnet sonarscanner begin `
          /k:"Potion-Service" `
          /d:sonar.host.url="https://sonarcloud.io" `
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
          /d:sonar.cs.opencover.reportsPaths="coverage.xml" `
          /d:sonar.coverage.exclusions="**Tests*.cs,**/*.Tests.cs" `
          /d:sonar.exclusions="**/Migrations/**,**/bin/**,**/obj/**" `
          /d:sonar.coverageReportPaths="coverage.xml"

        dotnet build ${{ env.SOLUTION_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }}

        dotnet-coverage collect "dotnet test ${{ env.SOLUTION_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-build" -o coverage.xml

        dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      if: env.SONAR_TOKEN != ''

  # ビルドとテスト
  build-and-test:
    name: Build and Test
    runs-on: windows-latest
    needs: [validate, security-scan, code-quality]
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration ${{ matrix.configuration }} --no-restore

    - name: Run tests
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration ${{ matrix.configuration }} --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Run benchmarks
      run: |
        if (Test-Path "tests/Potion.Service.Benchmarks") {
          dotnet run --project tests/Potion.Service.Benchmarks --configuration ${{ matrix.configuration }}
        }
      continue-on-error: true

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.cobertura.xml
        flags: unittests
        name: codecov-umbrella
      if: matrix.configuration == 'Release'

  # 統合テスト
  integration-tests:
    name: Integration Tests
    runs-on: windows-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Run integration tests
      run: |
        if (Test-Path "tests/Potion.Service.IntegrationTests") {
          dotnet test tests/Potion.Service.IntegrationTests --configuration ${{ env.BUILD_CONFIGURATION }} --verbosity normal
        } else {
          Write-Host "tests/Potion.Service.IntegrationTests does not exist; skipping (end-to-end step below covers the live service)."
        }

    - name: Run end-to-end tests
      run: |
        # Start service in background
        Start-Process -FilePath "dotnet" -ArgumentList "run --project src/Potion.Service --configuration ${{ env.BUILD_CONFIGURATION }}" -NoNewWindow
        Start-Sleep -Seconds 30

        # Test liveness and readiness probes (Startup.cs / scripts/validate-system.sh)
        Invoke-WebRequest -Uri "http://localhost:5000/health" -Method GET | Out-Null
        Invoke-WebRequest -Uri "http://localhost:5000/health/ready" -Method GET | Out-Null

        # Test dashboard health endpoints
        Invoke-WebRequest -Uri "http://localhost:5000/api/health" -Method GET | Out-Null
        Invoke-WebRequest -Uri "http://localhost:5000/api/health/metrics" -Method GET | Out-Null

        # Test security endpoints
        Invoke-WebRequest -Uri "http://localhost:5000/api/health/security" -Method GET | Out-Null
        Invoke-WebRequest -Uri "http://localhost:5000/api/health/security/summary" -Method GET | Out-Null

        # Test Prometheus metrics endpoint
        Invoke-WebRequest -Uri "http://localhost:5000/metrics" -Method GET | Out-Null

        # Stop service
        Stop-Process -Name "dotnet" -Force

  # 高度テスト
  advanced-tests:
    name: Advanced Tests
    runs-on: windows-latest
    needs: integration-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Run property-based tests
      run: |
        if (Test-Path "tests/Potion.Service.PropertyTests") {
          dotnet test tests/Potion.Service.PropertyTests --configuration ${{ env.BUILD_CONFIGURATION }} --no-build
        }

    - name: Run mutation tests
      run: |
        if (Test-Path "tests/Potion.Service.MutationTests") {
          dotnet test tests/Potion.Service.MutationTests --configuration ${{ env.BUILD_CONFIGURATION }} --no-build
        }

    - name: Run chaos tests
      run: |
        # Start service
        Start-Process -FilePath "dotnet" -ArgumentList "run --project src/Potion.Service --configuration ${{ env.BUILD_CONFIGURATION }}" -NoNewWindow
        Start-Sleep -Seconds 30

        # Run chaos experiment
        $chaosDefinition = @{
            Name = "CIBuildChaos"
            Description = "CI/CD chaos test"
            FaultType = 1
            Duration = "00:01:00"
            Intensity = 0.2
        } | ConvertTo-Json

        try {
            Invoke-WebRequest -Uri "http://localhost:5000/api/health/chaos/experiment" `
                -Method POST `
                -Body $chaosDefinition `
                -ContentType "application/json" | Out-Null
        }
        catch {
            Write-Warning "Chaos experiment failed (expected in CI)"
        }

        # Stop service
        Stop-Process -Name "dotnet" -Force

  # デプロイ
  deploy:
    name: Deploy
    runs-on: windows-latest
    needs: [build-and-test, integration-tests, advanced-tests]
    if: needs.validate.outputs.should-deploy == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Publish application
      run: |
        dotnet publish src/Potion.Service/Potion.Service.csproj `
          --configuration ${{ env.BUILD_CONFIGURATION }} `
          --output ./publish `
          --self-contained false `
          --runtime win-x64

    - name: Create release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          ## Changes
          - Automated release v${{ github.run_number }}
          - Built from commit ${{ github.sha }}
          - Performance optimized build
          - Security hardened configuration

    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./publish/Potion.Service.exe
        asset_name: Potion.Service.exe
        asset_content_type: application/octet-stream

    - name: Upload additional assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./publish/appsettings.json
        asset_name: appsettings.json
        asset_content_type: application/json

  # 通知
  notification:
    name: Notification
    runs-on: windows-latest
    needs: [security-scan, code-quality, build-and-test, integration-tests, advanced-tests, deploy]
    if: always() && (needs.security-scan.outputs.vulnerabilities-found == 'true' || needs.security-scan.result != 'success' || needs.code-quality.result != 'success' || needs.build-and-test.result != 'success' || needs.integration-tests.result != 'success' || needs.advanced-tests.result != 'success')

    steps:
    - name: Notify on failure
      run: |
        echo "Build failed - check logs for details"
      if: failure()

    # Issue は「実際に脆弱性が検出されたとき」だけ作成する。
    # security-scan の失敗（ツール側のエラー等）では作成しない。
    # 同じタイトルの open Issue が既にある場合は重複作成しない。
    - name: Create issue on security vulnerability
      uses: actions/github-script@v7
      with:
        script: |
          const title = 'Security Vulnerability Detected in CI/CD';
          const openIssues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            per_page: 100
          });
          const alreadyOpen = openIssues.data.some(
            issue => !issue.pull_request && issue.title === title
          );
          if (alreadyOpen) {
            console.log('An open issue with the same title already exists; skipping creation.');
            return;
          }
          const details = ${{ toJSON(needs.security-scan.outputs.vulnerability-details) }};
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: [
              'NuGet Audit detected vulnerable packages in the CI/CD security scan.',
              '',
              details ? `Detected:\n${details}` : 'See the Security Scan job summary and the nuget-audit-results artifact for details.',
              '',
              `Workflow run: ${runUrl}`
            ].join('\n'),
            labels: ['security', 'urgent']
          });
      if: needs.security-scan.outputs.vulnerabilities-found == 'true'
